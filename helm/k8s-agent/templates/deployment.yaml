apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /app/config/config.yaml
            - name: LLM_BASE_URL
              value: {{ .Values.env.llmBaseUrl | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
          {{- if or .Values.secret.existingSecret .Values.secret.apiKey }}
          envFrom:
            - secretRef:
                name: {{ include "k8s-agent.secretName" . }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "k8s-agent.fullname" . }}-config
      restartPolicy: Always
