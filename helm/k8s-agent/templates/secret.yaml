{{- if and .Values.secret.create .Values.secret.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-agent.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
type: Opaque
data:
  LLM_API_KEY: {{ .Values.secret.apiKey | b64enc }}
{{- end }}
