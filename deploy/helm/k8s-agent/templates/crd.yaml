apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: seenfindings.k8s-agent.dev
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
spec:
  group: k8s-agent.dev
  scope: Namespaced
  names:
    plural: seenfindings
    singular: seenfinding
    kind: SeenFinding
    shortNames: ["sf"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [source, resource, fingerprint, lastSeen, count]
              properties:
                source: {type: string}
                resource: {type: string}
                fingerprint: {type: string}
                severity: {type: string}
                message: {type: string}
                recommendation: {type: string}
                firstSeen: {type: string, format: date-time}
                lastSeen: {type: string, format: date-time}
                count: {type: integer}
      additionalPrinterColumns:
        - {name: Source, type: string, jsonPath: .spec.source}
        - {name: Resource, type: string, jsonPath: .spec.resource}
        - {name: Count, type: integer, jsonPath: .spec.count}
        - {name: LastSeen, type: string, jsonPath: .spec.lastSeen}
        - {name: Recommendation, type: string, jsonPath: .spec.recommendation}
