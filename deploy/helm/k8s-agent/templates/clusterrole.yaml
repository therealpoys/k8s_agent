apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-agent.fullname" . }}
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "get"]
  {{- /* FalcoPlugin: pods/list/get und pods/log/get sind bereits cluster-weit oben enthalten.
         Kein zusätzlicher RBAC-Block nötig — der Falco-Namespace ist damit abgedeckt. */}}
  {{- if .Values.agentConfig.plugins.optional.trivy }}
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "configauditreports", "exposedsecretreports"]
    verbs: ["list", "get"]
  {{- end }}
