image:
  repository: k8s-agent
  tag: latest
  pullPolicy: IfNotPresent

schedule: "* * * * *"

# Wird als config.yaml in den Container gemountet
agentConfig:
  llm:
    provider: anthropic          # anthropic | openai | ollama
    model: claude-haiku-4-5-20251001
    timeout_seconds: 60
    # base_url nur für Ollama nötig:
    # base_url: http://ollama.ollama.svc.cluster.local:11434

  kubernetes:
    namespaces:
      - default
    log_lines: 100
    falco_namespace: falco

  prometheus:
    url: http://prometheus-operated.monitoring.svc.cluster.local:9090

  plugins:
    core:
      - pod_logs
    optional:
      trivy: false
      falco: false
      prometheus: false

  outputs:
    - console

# Name eines bereits existierenden Secrets mit LLM API-Keys
# Das Secret muss ANTHROPIC_API_KEY oder OPENAI_API_KEY enthalten
existingSecret: k8s-agent-secrets

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Trivy Operator — https://aquasecurity.github.io/helm-charts/
# Wenn enabled: true, wird der Trivy Operator als Sub-Chart mitinstalliert.
# Danach agentConfig.plugins.optional.trivy auf true setzen um das Plugin zu aktivieren.
trivy-operator:
  enabled: false

# Falco — https://falcosecurity.github.io/charts/
# Wenn enabled: true, wird Falco als Sub-Chart mitinstalliert.
# Danach agentConfig.plugins.optional.falco auf true setzen um das Plugin zu aktivieren.
# json_output: true ist Pflicht damit der FalcoPlugin die Alerts parsen kann.
falco:
  enabled: false
  falco:
    json_output: true
    json_include_output_property: true

# Prometheus (kube-prometheus-stack) — https://github.com/prometheus-community/helm-charts
# Wenn enabled: true, wird Prometheus (inkl. Operator) als Sub-Chart mitinstalliert.
# Danach agentConfig.plugins.optional.prometheus auf true setzen um das Plugin zu aktivieren.
# agentConfig.prometheus.url ggf. an den tatsächlichen Release-Namespace anpassen.
# Grafana/Alertmanager werden vom PrometheusPlugin nicht gebraucht, daher deaktiviert.
kube-prometheus-stack:
  enabled: false
  grafana:
    enabled: false
  alertmanager:
    enabled: false
