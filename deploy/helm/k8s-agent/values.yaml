image:
  repository: k8s-agent
  tag: latest
  pullPolicy: IfNotPresent

schedule: "* * * * *"
# Harter Timeout pro Lauf — verhindert dass ein hängender Job wegen
# concurrencyPolicy: Forbid alle folgenden Läufe blockiert.
activeDeadlineSeconds: 300

# Wird als config.yaml in den Container gemountet
agentConfig:
  llm:
    provider: anthropic          # anthropic | openai | ollama
    model: claude-haiku-4-5-20251001
    timeout_seconds: 60
    # base_url nur für Ollama nötig:
    # base_url: http://ollama.ollama.svc.cluster.local:11434

  kubernetes:
    namespaces:
      - default
    log_lines: 100
    falco_namespace: falco

  prometheus:
    url: http://prometheus-operated.monitoring.svc.cluster.local:9090

  # Zwei unabhängige Schalter pro optionalem Plugin:
  #   1. agentConfig.plugins.optional.<name>  → Plugin im Agent aktiv?
  #   2. <name>.enabled weiter unten          → Software als Sub-Chart HIER mitinstallieren?
  # Getrennt, weil z.B. Trivy/Prometheus schon anderswo im Cluster laufen können —
  # dann Plugin auf true, Sub-Chart-Install auf false.
  plugins:
    core:
      - pod_logs
      - k8s_events
    optional:
      trivy: false
      falco: false
      prometheus: false

  outputs:
    - console

# Name eines bereits existierenden Secrets mit LLM API-Keys
# Das Secret muss ANTHROPIC_API_KEY oder OPENAI_API_KEY enthalten
existingSecret: k8s-agent-secrets

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Trivy Operator — https://aquasecurity.github.io/helm-charts/
# enabled: true installiert den Trivy Operator als Sub-Chart dieses Charts.
# Läuft Trivy bereits woanders im Cluster, hier auf false lassen und stattdessen
# nur agentConfig.plugins.optional.trivy oben auf true setzen.
trivy-operator:
  enabled: false

# Falco — https://falcosecurity.github.io/charts/
# enabled: true installiert Falco als Sub-Chart dieses Charts (siehe trivy-operator-
# Kommentar oben zur Trennung von Sub-Chart-Install und Plugin-Aktivierung).
# json_output: true ist Pflicht damit der FalcoPlugin die Alerts parsen kann.
falco:
  enabled: false
  falco:
    json_output: true
    json_include_output_property: true

# Prometheus (kube-prometheus-stack) — https://github.com/prometheus-community/helm-charts
# enabled: true installiert Prometheus (inkl. Operator) als Sub-Chart dieses Charts
# (siehe trivy-operator-Kommentar oben zur Trennung von Sub-Chart-Install und
# Plugin-Aktivierung). agentConfig.prometheus.url ggf. an den tatsächlichen
# Release-Namespace anpassen — auch wenn Prometheus extern läuft.
# Grafana/Alertmanager werden vom PrometheusPlugin nicht gebraucht, daher deaktiviert.
kube-prometheus-stack:
  enabled: false
  grafana:
    enabled: false
  alertmanager:
    enabled: false
